# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - bc-dev-Be-01

on:
  push:
    branches:
      - Development
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Build with dotnet
        run: dotnet build ./API-Layer/API-Layer.csproj --configuration Release

      - name: dotnet publish
        run: dotnet publish ./API-Layer/API-Layer.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: .net-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_38196AF052DF46839564CE666DED8C04 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B99D3EF9FCE94F2CBF40866771E11662 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E2A76CEF67694A9DB7646D08302EC742 }}

      - name: Set up .NET Core for migrations
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.x'

      - name: Install dotnet-ef
        run: dotnet tool install --global dotnet-ef --version 8.0.8


      - name: Validate migration secrets
        env:
          AZURE_SQL_CONNECTION_STRING: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}
          JWT_SETTINGS_SECRET: ${{ secrets.JWT_SETTINGS_SECRET }}
          JWT_SETTINGS_REFRESH_TOKEN_PEPPER: ${{ secrets.JWT_SETTINGS_REFRESH_TOKEN_PEPPER }}
        run: |
          test -n "$AZURE_SQL_CONNECTION_STRING" || (echo "Missing secret: AZURE_SQL_CONNECTION_STRING" && exit 1)
          test -n "$JWT_SETTINGS_SECRET" || (echo "Missing secret: JWT_SETTINGS_SECRET" && exit 1)
          test -n "$JWT_SETTINGS_REFRESH_TOKEN_PEPPER" || (echo "Missing secret: JWT_SETTINGS_REFRESH_TOKEN_PEPPER" && exit 1)

      - name: Apply EF Core migrations
        env:
          ConnectionStrings__DefaultConnection: ${{ secrets.AZURE_SQL_CONNECTION_STRING }}
          JwtSettings__Secret: ${{ secrets.JWT_SETTINGS_SECRET }}
          JwtSettings__Issuer: ElsaBeautyClinic
          JwtSettings__Audience: ElsaBeautyClinic
          JwtSettings__ExpiryMinutes: 15
          JwtSettings__RefreshTokenExpiryDays: 7
          JwtSettings__RefreshTokenPepper: ${{ secrets.JWT_SETTINGS_REFRESH_TOKEN_PEPPER }}
          Storage__UseAzurite: true
          Storage__ConnectionString: UseDevelopmentStorage=true
        run: |
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet restore ./API-Layer/API-Layer.csproj
          dotnet restore ./Infrastructure-Layer/Infrastructure-Layer.csproj
          dotnet ef database update --project ./Infrastructure-Layer --startup-project ./API-Layer

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'bc-dev-Be-01'
          slot-name: 'Production'
          package: ./.net-app
