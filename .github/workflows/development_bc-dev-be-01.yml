name: Build and deploy ASP.Net Core app to Azure Web App - bc-dev-Be-01

on:
  push:
    branches:
      - Development
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore ./API-Layer/API-Layer.csproj

      - name: Build
        run: dotnet build ./API-Layer/API-Layer.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish ./API-Layer/API-Layer.csproj -c Release -o ${{env.DOTNET_ROOT}}/myapp

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: .net-app
          path: .net-app

      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_38196AF052DF46839564CE666DED8C04 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_B99D3EF9FCE94F2CBF40866771E11662 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_E2A76CEF67694A9DB7646D08302EC742 }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'bc-dev-Be-01'
          slot-name: 'Production'
          package: ./.net-app
